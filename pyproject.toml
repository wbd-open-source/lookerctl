[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lookerctl"
dynamic = ["version"]
description = "CLI tool for managing Looker projects"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}

dependencies = [
    "click",
    "looker-sdk==24.14.0",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
    "pytest==8.3.4",
    "flake8==7.1.1"]

[tool.setuptools.dynamic]
version = {attr = "src.lookerctl.lib.version.version"}

[project.scripts]
lookerctl = "src.lookerctl.lib.lookerctl:cli"

[tool.setuptools.package-data]
lookerctl = ["config/*.yaml"]
